version: "2"

# Lint gate: the release workflow runs scripts/lint.sh and any finding blocks
# the release. Findings are fixed in the code. `//nolint` comments are not
# used, and scripts/lint.sh fails if one appears under cmd/ or internal/.

run:
  timeout: 10m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - gosec
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      verbose: true
      # No function is excused. A close that can fail is either handled or goes
      # through internal/tidy, which logs the failure: at warning level for a
      # database, connection, repository, storage or session, at debug level only
      # for a temporary file or a read handle whose result nobody can use.
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck covers these, and excuses no function
        - G115 # integer conversions: uid/size/count values far inside the target range
        - G118 # jobs started from a request run on a background context on purpose: they outlive the request
        - G304 # a backup tool reads paths from its configuration and data directory by design
  exclusions:
    rules:
      # Tests and the fakes they use: an unchecked error there fails the test
      # anyway, and gosec's rules are about production code.
      - path: _test\.go
        linters: [errcheck, gosec]
      - path: internal/(docker/dockertest|virt/virttest)/
        linters: [errcheck, gosec]
      # The session and login-state cookies are HttpOnly and SameSite=Lax always,
      # and Secure whenever the request came over HTTPS (directly or through the
      # operator's reverse proxy). A literal Secure: true would break the UI over
      # plain HTTP. Only this rule, only this file.
      - path: internal/webauth/webauth\.go
        linters: [gosec]
        text: "G124"
      # An agent enrolling has no CA to trust yet. Its token carries the hash of
      # the server's certificate, and VerifyConnection rejects any other one, so
      # the connection is pinned, not unverified. gosec cannot see that check and
      # flags InsecureSkipVerify. The full explanation is in the comment above
      # the tls.Config in internal/agent/register.go. Only this rule, only this
      # file; removing it needs the registration token to carry the server's
      # certificate, which changes the token format.
      - path: internal/agent/register\.go
        linters: [gosec]
        text: "G402"

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
