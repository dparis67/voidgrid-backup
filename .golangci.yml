version: "2"

# Lint gate: the release workflow runs scripts/lint.sh and any finding blocks
# the release. Findings are fixed in the code. `//nolint` comments are not
# used, and scripts/lint.sh fails if one appears under cmd/ or internal/.

run:
  timeout: 10m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - gosec
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      verbose: true
      # Cleanup calls whose error can't lose data: closing read handles,
      # connections and transactions that already failed. File Close, Remove
      # and writes are NOT listed, so an unchecked close on a write path is
      # still caught.
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*flag.FlagSet).Parse # ExitOnError: exits on its own
        - (*github.com/digitalocean/go-libvirt.Libvirt).Disconnect
        - (*github.com/voidgrid/voidgrid-backup/internal/catalog.Catalog).Close
        - (github.com/kopia/kopia/repo.Repository).Close # writes are flushed by repo.WriteSession, which is checked
        - (github.com/kopia/kopia/repo/blob.Storage).Close
        - (*google.golang.org/grpc.ClientConn).Close
        - (net.Conn).Close
        - (*net/http.Server).Close
        - (*net/smtp.Client).Close
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck covers these, with its curated exclusions above
        - G115 # integer conversions: uid/size/count values far inside the target range
        - G118 # jobs started from a request run on a background context on purpose: they outlive the request
        - G304 # a backup tool reads paths from its configuration and data directory by design
  exclusions:
    rules:
      # Tests and the fakes they use: an unchecked error there fails the test
      # anyway, and gosec's rules are about production code.
      - path: _test\.go
        linters: [errcheck, gosec]
      - path: internal/(docker/dockertest|virt/virttest)/
        linters: [errcheck, gosec]
      # The session and login-state cookies are HttpOnly and SameSite=Lax always,
      # and Secure whenever the request came over HTTPS (directly or through the
      # operator's reverse proxy). A literal Secure: true would break the UI over
      # plain HTTP. Only this rule, only this file.
      - path: internal/webauth/webauth\.go
        linters: [gosec]
        text: "G124"
      # An agent enrolling has no CA to trust yet. Its token carries the hash of
      # the server's certificate, and VerifyConnection rejects any other one, so
      # the connection is pinned, not unverified. Only this rule, only this file.
      - path: internal/agent/register\.go
        linters: [gosec]
        text: "G402"

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
