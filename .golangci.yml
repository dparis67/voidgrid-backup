version: "2"

# Lint gate: the release workflow runs scripts/lint.sh and any finding blocks
# the release. Findings are fixed in the code. `//nolint` comments are not
# used, and scripts/lint.sh fails if one appears under cmd/ or internal/.

run:
  timeout: 10m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - gosec
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      verbose: true
      # No function is excused. A close that can fail is either handled or goes
      # through internal/tidy, which logs the failure: at warning level for a
      # database, connection, repository, storage or session, at debug level only
      # for a temporary file or a read handle whose result nobody can use.
  exclusions:
    rules:
      # gosec is excused in tests and in the fakes they use, and errcheck is not:
      # a failed setup call or close there must fail the test or be reported. What
      # gosec finds in that code is about code that only runs under `go test`:
      # the permissions of fixtures in temporary directories (G301, G302, G306),
      # reading a test's own file (G304), cookies built by hand (G124), a test
      # client that skips verifying a self-signed test server (G402), and an
      # HTTP server in a fake with no header timeout (G112).
      - path: _test\.go
        linters: [gosec]
      - path: internal/(docker/dockertest|virt/virttest)/
        linters: [gosec]
      # G304 (opening a path held in a variable) is excused for exactly two
      # functions, each in a file of its own, because the path is the operator's
      # own argument and opening it is the feature: the recovery tool's
      # -password-file, and the restore target directory the operator chose
      # (checked by guard.RestoreTarget first). Every other file the program
      # opens is confined to its directory with internal/confined, or is
      # opened through os.Root.
      - path: cmd/voidgrid-backup-recover/password\.go
        linters: [gosec]
        text: "G304"
      - path: internal/engine/emptydir\.go
        linters: [gosec]
        text: "G304"
      # Cookies are HttpOnly and SameSite=Lax always, and Secure whenever the
      # request came over HTTPS (directly or through the operator's reverse proxy).
      # On plain HTTP a browser drops a Secure cookie, so the flag is off there and
      # gosec's G124 cannot tell why. That decision lives in one function in one
      # file; only this rule, only this file.
      - path: internal/webauth/cookies\.go
        linters: [gosec]
        text: "G124"
      # An agent enrolling has no CA to trust yet. Its token carries the hash of
      # the server's certificate, and VerifyConnection rejects any other one, so
      # the connection is pinned, not unverified. gosec cannot see that check and
      # flags InsecureSkipVerify. The full explanation is in the comment above
      # the tls.Config in internal/agent/register.go. Only this rule, only this
      # file; removing it needs the registration token to carry the server's
      # certificate, which changes the token format.
      - path: internal/agent/register\.go
        linters: [gosec]
        text: "G402"

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
