{{define "top"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · voidgrid-backup</title>
<style>
  /* Theme tokens. Every colour, the font and the corner radius on every page come
     from here, so a change to this block restyles the whole UI. One theme: green
     on black, like a terminal. Status colours stay red and amber so a failure never
     reads as success. */
  :root {
    color-scheme: dark;
    --bg: #000000;        /* page */
    --card: #040a05;      /* panels, tables */
    --fg: #33ff66;        /* text */
    --muted: #1fa84a;     /* secondary text, table headers */
    --line: #0f4a22;      /* borders, dividers */
    --accent: #00ff66;    /* links, buttons, focus */
    --on-accent: #000000; /* text on an accent-coloured button */
    --ok: #33ff66;
    --bad: #ff5555;
    --warn: #ffb000;
    --notice: #06210d;    /* info banner */
    --font: ui-monospace, "JetBrains Mono", "Fira Code", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --radius: 2px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 var(--font); }
  ::selection { background: var(--accent); color: var(--on-accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  header { padding: 12px 24px; border-bottom: 1px solid var(--line); display: flex; gap: 24px;
           align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  header nav { display: flex; gap: 16px; }
  header nav a { color: var(--muted); } header nav a.on { color: var(--fg); font-weight: 600; }
  header .ver { margin-left: auto; color: var(--muted); font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  h2 { font-size: 15px; margin: 28px 0 10px; }
  h2:first-child { margin-top: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: break-word; }
  th, td.num { white-space: nowrap; }
  td.mono { overflow-wrap: anywhere; } /* paths, hosts and IDs have no spaces to break at */
  th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  th a.sort { color: inherit; }
  form.inline { display: inline; margin: 0; }
  input.sched { width: 11em; padding: 3px 6px; }
  td .warn { font-size: 12px; white-space: normal; max-width: 22em; }
  .tl-wrap { overflow-x: auto; }
  .tl { min-width: 900px; padding: 8px 0; }
  .tl-lane { display: flex; align-items: flex-start; margin: 2px 0; }
  .tl-label { flex: 0 0 11em; padding: 4px 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-track { position: relative; flex: 1; margin-right: 12px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .tl-head .tl-track { border: 0; }
  .tl-tick { position: absolute; top: 0; font-size: 11px; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
  .tl-line { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); opacity: .5; }
  .tl-now { position: absolute; top: 0; bottom: 0; border-left: 2px solid var(--warn); }
  .tl-bar { position: absolute; height: 20px; line-height: 18px; padding: 0 4px; overflow: hidden; white-space: nowrap; font-size: 12px;
            background: var(--card); color: var(--fg); border: 1px solid var(--accent); border-radius: var(--radius); }
  .tl-bar:hover { background: var(--accent); color: var(--on-accent); text-decoration: none; }
  .tl-bar.movable { cursor: grab; touch-action: none; user-select: none; }
  .tl-bar.dragging { cursor: grabbing; z-index: 2; box-shadow: 0 2px 8px rgba(0,0,0,.35); opacity: 1; }
  .tl-bar.clash { border-color: var(--warn); color: var(--warn); }
  .tl-bar { min-width: 10px; }
  .tl-bar.spill { overflow: visible; }
  .tl-name { position: absolute; top: 0; white-space: nowrap; color: var(--fg); }
  .tl-name.right { left: calc(100% + 4px); }
  .tl-name.left { right: calc(100% + 4px); }
  .tl-bar.guess { border-style: dashed; }
  .tl-bar.maint { background-image: repeating-linear-gradient(135deg, transparent 0 5px, rgba(127,127,127,.25) 5px 8px); }
  .tl-bar.past { opacity: .55; }
  p a.on { font-weight: 600; text-decoration: underline; }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--font); font-size: 13px; }
  .ok, .success { color: var(--ok); } .bad, .failed { color: var(--bad); } .warn, .partial, .running { color: var(--warn); }
  .muted { color: var(--muted); }
  details.fold { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin: 10px 0; }
  details.fold > summary { padding: 10px 14px; cursor: pointer; display: flex; gap: 6px 12px; align-items: baseline;
                           flex-wrap: wrap; list-style: none; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: "\25B8"; color: var(--muted); }
  details.fold[open] > summary::before { content: "\25BE"; }
  details.fold[open] > summary { border-bottom: 1px solid var(--line); }
  .fold-name { font-weight: 600; }
  .fold-body { padding: 4px 14px 14px; }
  .fold-body h3 { font-size: 14px; margin: 16px 0 8px; }
  .tag { font-size: 12px; padding: 1px 8px; border: 1px solid currentColor; border-radius: 999px; }
  .wrap { white-space: pre-wrap; }
  .err { white-space: pre-wrap; color: var(--bad); font-size: 13px; }
  .empty { padding: 16px 14px; color: var(--muted); }
  form.grid { padding: 16px; display: grid; gap: 12px; grid-template-columns: repeat(2, 1fr); }
  form.grid .wide, form.grid fieldset, form.grid .actions { grid-column: 1 / -1; }
  fieldset { border: 1px dashed var(--line); border-radius: var(--radius); padding: 10px 12px 12px;
             display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); }
  fieldset legend { font-size: 13px; color: var(--muted); padding: 0 4px; }
  fieldset .wide { grid-column: 1 / -1; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  label.check { display: flex; gap: 8px; align-items: center; color: var(--fg); }
  input, select, textarea { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--radius);
          background: var(--bg); color: var(--fg); }
  textarea { font-family: var(--font); font-size: 13px; min-height: 64px; }
  table.sizes { grid-column: 1 / -1; width: 100%; table-layout: fixed; }
  table.sizes th, table.sizes td { padding: 6px 8px; white-space: normal; overflow-wrap: anywhere; vertical-align: middle; }
  table.sizes .tick { width: 32px; }
  table.sizes .col-size { width: 130px; } table.sizes .col-files { width: 110px; }
  table.sizes .col-by { width: 22%; }
  table.sizes th.num { text-align: right; }
  table.sizes td .note { display: block; font-size: 12px; }
  .keep { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; grid-column: 1 / -1; }
  button { font: inherit; padding: 7px 16px; border: 0; border-radius: var(--radius); background: var(--accent);
           color: var(--on-accent); cursor: pointer; font-weight: 600; }
  button.plain { background: transparent; color: var(--accent); border: 1px solid var(--line); font-weight: normal; }
  button.plain:hover { border-color: var(--accent); }
  button.danger { background: var(--bad); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .alert { border: 1px solid var(--bad); color: var(--bad); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; white-space: pre-wrap; }
  .notice { background: var(--notice); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; }
  .secret { border: 2px solid var(--warn); border-radius: var(--radius); padding: 14px; margin-bottom: 16px; }
  .secret code { display: block; font-size: 17px; margin: 8px 0; user-select: all; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; padding: 14px; margin: 0; }
  dt { color: var(--muted); font-size: 13px; } dd { margin: 0; }
  .repo { margin-bottom: 14px; }
  .repo-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .prog { font-size: 13px; overflow-wrap: anywhere; }
  details.job-delete { flex: 0 1 auto; }
  details.job-delete[open] { flex: 1 1 100%; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  details.job-delete > summary { list-style: none; cursor: pointer; padding: 7px 16px; color: var(--bad); border: 1px solid var(--line); border-radius: var(--radius); }
  details.job-delete > summary::-webkit-details-marker { display: none; }
  details.job-delete[open] > summary { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
  a.job-delete-link { margin-left: 8px; color: var(--bad); }
  .repo-edit { margin-left: auto; }
  .repo-loc { padding: 10px 14px 0; overflow-wrap: anywhere; }
  dl.repo-facts { grid-template-columns: repeat(auto-fit, minmax(13em, 1fr)); gap: 14px 20px; }
  .repo-facts dd { margin-top: 2px; }
  .repo-agents { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 14px 12px; }
  .chip { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 3px 10px; border: 1px solid var(--line); border-radius: var(--radius); }
  .chip button.plain { padding: 1px 8px; font-size: 12px; }
  .repo-note { padding: 0 14px 12px; margin: 0; }
  details.repo-more { border-top: 1px solid var(--line); padding: 8px 14px; }
  details.repo-more > summary { cursor: pointer; }
  .repo-sections { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(20em, 1fr)); padding: 12px 0 4px; }
  .repo-sections h3 { font-size: 14px; margin: 0 0 6px; }
  .repo-sections form { display: grid; gap: 8px; align-content: start; }
  .repo-sections form + form { margin-top: 14px; }
  @media (max-width: 700px) {
    form.grid, fieldset { grid-template-columns: 1fr; } .keep { grid-template-columns: repeat(3, 1fr); }
    main { padding: 16px; } header { padding: 12px 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>voidgrid-backup</h1>
  <nav>
    <a href="/" {{if eq .Nav "agents"}}class="on"{{end}}>Agents</a>
    <a href="/repositories" {{if eq .Nav "repos"}}class="on"{{end}}>Repositories</a>
    <a href="/jobs" {{if eq .Nav "jobs"}}class="on"{{end}}>Jobs</a>
    <a href="/schedule" {{if eq .Nav "schedule"}}class="on"{{end}}>Schedule</a>
    <a href="/logs" {{if eq .Nav "logs"}}class="on"{{end}}>Logs</a>
    <a href="/notifications" {{if eq .Nav "notifications"}}class="on"{{end}}>Notifications</a>
    <a href="/authentication" {{if eq .Nav "authentication"}}class="on"{{end}}>Authentication</a>
  </nav>
  {{if .User}}<span class="row" style="margin-left:auto">
    <span class="muted">{{.User}}</span>
    <form method="post" action="/auth/logout"><button class="plain" type="submit">Sign out</button></form>
  </span>{{end}}
  <span class="ver"{{if .User}} style="margin-left:0"{{end}} title="Every time and cron schedule in this interface is in the server's time zone (its TZ setting)">{{.TZ}} · {{.Version}}</span>
</header>
<main>
  {{if .Notice}}<div class="notice">{{.Notice}}</div>{{end}}
  {{if .Error}}<div class="alert">{{.Error}}</div>{{end}}
{{end}}

{{define "bottom"}}
</main>
<script>
// Live regions. A page marks the parts that change with ids and adds
// <div id="live" data-ids="a,b" data-every="3000">. Every `every` ms (not while
// the tab is hidden) the page is fetched again and only those parts are swapped
// in, so nothing else moves and no reload happens. The fetched page decides
// whether to keep going: when it has no #live, the refreshing stops.
(function () {
  function every() { var l = document.getElementById("live"); return (l && parseInt(l.dataset.every, 10)) || 5000; }
  function tick() {
    var live = document.getElementById("live");
    if (!live) return;
    var again = function () { if (document.getElementById("live")) setTimeout(tick, every()); };
    if (document.hidden) { again(); return; }
    fetch(location.pathname + location.search, { credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.text() : Promise.reject(new Error("status " + r.status)); })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        live.dataset.ids.split(",").forEach(function (id) {
          var fresh = doc.getElementById(id), old = document.getElementById(id);
          // Leave a region alone while the user is typing in it.
          var editing = old && (old.contains(document.activeElement) ||
            Array.prototype.some.call(old.querySelectorAll("input"), function (i) { return i.type !== "hidden" && i.value !== i.defaultValue; }));
          if (fresh && old && !editing) old.replaceWith(fresh);
        });
        var next = doc.getElementById("live");
        if (next) live.replaceWith(next); else live.remove();
      })
      .catch(function () {})
      .then(again);
  }
  if (document.getElementById("live")) setTimeout(tick, every());
})();
</script>
<script>
// Sizes are measured on the agent (a bounded walk) and filled in after the page
// loads, so the page itself never waits on a big directory. A row is any element
// with data-usage, data-agent and data-path, holding a [data-size] and a
// [data-files] cell. All text goes in via textContent.
(function () {
  function fill(row, d) {
    var size = row.querySelector("[data-size]"), files = row.querySelector("[data-files]");
    size.title = ""; size.classList.remove("err");
    if (d.error) {
      size.textContent = "unavailable"; size.title = d.error; size.classList.add("muted");
      files.textContent = "-";
      return;
    }
    size.textContent = d.size || "-";
    files.textContent = d.files.toLocaleString() + (d.truncated ? "+" : "");
  }
  function measure(agent, path, row) {
    row.querySelector("[data-size]").textContent = "measuring…";
    row.querySelector("[data-files]").textContent = "";
    var url = "/api/agents/" + encodeURIComponent(agent) + "/usage?walk=1&path=" + encodeURIComponent(path);
    return fetch(url, { credentials: "same-origin" })
      .then(function (r) { return r.json(); })
      .then(function (d) { fill(row, d); })
      .catch(function () { fill(row, { error: "could not measure", files: 0 }); });
  }
  // At most two walks at once so a stack with many mounts doesn't hammer the host.
  function run(jobs) {
    var next = 0;
    function worker() {
      if (next >= jobs.length) return;
      var j = jobs[next++];
      measure(j[0], j[1], j[2]).then(worker);
    }
    worker(); worker();
  }
  // Rows inside a collapsed card are measured when it is first opened, so a page
  // with many stacks doesn't walk every mount at load.
  function start(rows) {
    run(Array.prototype.filter.call(rows, function (el) {
      if (el.dataset.started) return false;
      el.dataset.started = "1";
      return true;
    }).map(function (el) { return [el.dataset.agent, el.dataset.path, el]; }));
  }
  start(Array.prototype.filter.call(document.querySelectorAll("[data-usage]"), function (el) {
    var d = el.closest("details");
    return !d || d.open;
  }));
  Array.prototype.forEach.call(document.querySelectorAll("details.fold"), function (d) {
    d.addEventListener("toggle", function () {
      if (d.open) start(d.querySelectorAll("[data-usage]"));
    });
  });

  function cell(tag, text, cls) {
    var c = document.createElement(tag);
    if (text) c.textContent = text;
    if (cls) c.className = cls;
    return c;
  }
  var btn = document.getElementById("check-sizes");
  if (btn) btn.addEventListener("click", function () {
    var form = btn.form, out = document.getElementById("path-sizes");
    out.textContent = "";
    var jobs = [];
    var table = cell("table", "", "sizes"), head = document.createElement("tr");
    head.appendChild(cell("th", "Path"));
    head.appendChild(cell("th", "Size", "num col-size"));
    head.appendChild(cell("th", "Files", "num col-files"));
    table.appendChild(head);
    form.elements.paths.value.split("\n").forEach(function (p) {
      p = p.trim();
      if (!p) return;
      var tr = document.createElement("tr");
      tr.appendChild(cell("td", p, "mono"));
      var size = cell("td", "", "num"), files = cell("td", "", "num");
      size.setAttribute("data-size", ""); files.setAttribute("data-files", "");
      tr.appendChild(size); tr.appendChild(files);
      table.appendChild(tr);
      jobs.push([form.elements.agent.value, p, tr]);
    });
    if (!jobs.length) return;
    out.appendChild(table);
    run(jobs);
  });
})();
</script>
<script>
// Add-job forms: prefill the schedule with a start that is free on the chosen
// agent and repository, and say why. The field is only replaced while it still
// holds what was suggested (or the page's default), so nothing typed is lost.
(function () {
  Array.prototype.forEach.call(document.querySelectorAll("input[data-suggest]"), function (field) {
    var form = field.form;
    if (!form) return;
    var agent = form.querySelector("[name=agent]"), repo = form.querySelector("[name=repository]");
    var note = form.querySelector("[data-suggest-note]");
    var last = field.value;
    function ask() {
      if (!agent || !repo || !agent.value || !repo.value) return;
      var url = "/api/suggest-schedule?agent=" + encodeURIComponent(agent.value) + "&repository=" + encodeURIComponent(repo.value);
      fetch(url, { credentials: "same-origin" })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("status " + r.status)); })
        .then(function (d) {
          if (field.value === last || field.value === "") { field.value = d.schedule; last = d.schedule; }
          if (note) { note.textContent = d.text; note.className = "hint" + (d.clash ? " warn" : ""); }
        })
        .catch(function () {});
    }
    if (agent) agent.addEventListener("change", ask);
    if (repo) repo.addEventListener("change", ask);
    // The jobs page fills the repository list after the agent is chosen.
    setTimeout(ask, 50);
  });
})();
</script>
</body>
</html>
{{end}}
